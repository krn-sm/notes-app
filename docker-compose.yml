services:
  postgres:
    image: postgres:16
    container_name: notes-postgres
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - notes_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: notes-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  notes_postgres_data: